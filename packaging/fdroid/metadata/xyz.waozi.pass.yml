    srclibs:
      - Ziran@1ad0264d9f6ce3df29e9071ab16eae0e1e557049
      - Kryon@a78576db722b25216e0096870d313b7d2ace96b0
      - Monocypher@d1895c3799005122b2e68f47f442cc5ba709d866
      - Oqs@22d2ddbdc236796953c905a05a2cebf5ab1b4ff3
      - Mingcute@9cc6872f75447c3a24c16764f9829d0f58751cb0
      - raylib@fafa2cea97d0cb379d832086ba45a989fa6f9c8e
      - DaochiClient@42aa3ee773d8abdc6b3a10fbcb1b73c992f0f564
      - liboqs@fd44469daeffe6b28f031f54f9bb66cbae69a572
      - Self@1ce89cff5a807cca817aec5d1347e18d2f229b27
      - Qrcode@2944b2e668e735438d8ce24e47a39be3f5c36af5
    prebuild:
      - printf '[overrides]\nziran = "$$Ziran$$"\nkryon = "$$Kryon$$"\nmingcute =
        "$$Mingcute$$"\ndaochi_client = "$$DaochiClient$$"\noqs = "$$Oqs$$"\nliboqs
        = "$$liboqs$$"\nmonocypher = "$$Monocypher$$"\nraylib = "$$raylib$$"\nself
        = "$$Self$$"\nqrcode = "$$Qrcode$$"\n' > ../../ziran.local.toml
      - sed -i -e 's|$ENV{KRYON_DIR}|$$Kryon$$|g' -e 's|$ENV{ZIRAN_ROOT}|$$Ziran$$|g'
        -e 's|$ENV{RAYLIB_DIR}|$$raylib$$/src|g' -e 's|$ENV{LIBOQS_DIR}|$$liboqs$$|g'
        -e 's|$ENV{MONOCYPHER_DIR}|$$Monocypher$$|g' src/main/cpp/CMakeLists.txt
      - sed -i 's@from(.*KRYON_DIR.*@from("$$Kryon$$/icons/pfp.png")@' build.gradle
    build:
      - make -C $$Ziran$$ all
      - make -C ../.. apps ZIRAN=$$Ziran$$/build/bin/ziran
    ndk: 28.2.13676358
    gradleprops:
      - fDroidBuild=true
      - abi=armeabi-v7a,arm64-v8a
      - splitApks=true

