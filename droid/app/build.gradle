plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.waozi.pass'
    compileSdk 36
    ndkVersion "28.2.13676358"

    def keystorePropsFile = rootProject.file("local.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    def getKeystorePath = { -> project.findProperty('keystore.path') ?: keystoreProps['keystore.path'] ?: System.getenv("HOME") + "/.android/pass-release.keystore" }
    def getKeystoreAlias = { -> project.findProperty('keystore.alias') ?: keystoreProps['keystore.alias'] ?: System.getenv('KEY_ALIAS') ?: "pass-key" }

    def releasePassword = project.findProperty('keystore.password') ?: System.getenv('KEYSTORE_PASSWORD') ?: ""

    def releaseKeystorePath = getKeystorePath()
    def releaseKeystore = releaseKeystorePath ? file(releaseKeystorePath) : null
    // Sign release builds only when a keystore is actually available: CI and
    // local release builds pass -Pkeystore.* properties, while clean checkouts
    // (for example an F-Droid builder) produce an unsigned APK instead.
    def fdroidBuild = (project.findProperty('fDroidBuild') ?: 'false').toString().toBoolean()
    def signRelease = !fdroidBuild \
        && releaseKeystore != null && releaseKeystore.exists() \
        && releasePassword != ""

    signingConfigs {
        release {
            if (signRelease) {
                storeFile releaseKeystore
                storePassword releasePassword
                keyAlias getKeystoreAlias()
                keyPassword releasePassword
            }
        }
    }

    defaultConfig {
        applicationId 'xyz.waozi.pass'
        minSdk 21
        targetSdk 36
        versionCode 18
        versionName "0.4.4"
        // Default to the two realistic phone targets; override with
        // -Pabi=x86_64 etc. for emulator builds.
        def abis = project.findProperty('abi') ?: 'armeabi-v7a,arm64-v8a'
        ndk {
            abis.split(',').collect { it.trim() }.each { abiFilters it }
        }
    }

    splits {
        abi {
            enable = (project.findProperty('splitApks') ?: 'false').toString().toBoolean()
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    buildTypes {
        release {
            signingConfig signRelease ? signingConfigs.release : null
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Bundle fonts without adding app or host Java code.
def prepareFonts = tasks.register('prepareFonts', Copy) {
    into layout.buildDirectory.dir('generated/passAssets/fonts')
    from('../../assets/fonts/NotoSans-Regular.ttf') { rename { 'ui.ttf' } }
    from('../../assets/fonts/NotoSans-OFL.txt')
    from('../../assets/fonts/emoji.ttf')
    from('../../assets/fonts/emoji-OFL.txt')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/passAssets'))
tasks.named('preBuild').configure { dependsOn prepareFonts }

// The tool apps are portable bundles, built once for every ABI.
def makeApps = tasks.register('makeApps', Exec) {
    workingDir '../..'
    commandLine 'make', 'portable-apps'
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/appAssets'))
def prepareImages = tasks.register('prepareImages', Sync) {
    dependsOn makeApps
    from('../../assets/app/icon.png')
    from("${System.getenv('KRYON_DIR')}/icons/pfp.png")
    from('../../build/apps') { include '*.zx'; exclude 'workbook.zx'; into 'apps' }
    into layout.buildDirectory.dir('generated/appAssets')
}
tasks.named('preBuild').configure { dependsOn prepareImages }
