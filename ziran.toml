[package]
tool = "kryon"
name = "Werkzeug"
entry = "src/desktop.zi"
module_roots = ["src", "apps/pass", "apps/calculator", "apps/clock", "apps/gallery"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "e0367fa9c5731dcf9bb84ed7f3d294570d8c0bda"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "43e6ea3d76ded207e2be93ff82b2a609c3cfeb91"

[dependencies.apps]
git = "https://git.waozi.xyz/waozi/apps.git"
ref = "c18e70b434456823a5d332255d78b48064f12de3"

[install]
bin = "werk"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop.zi"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.mesh_client]
git = "https://git.waozi.xyz/ziranlang/mesh-client.git"
ref = "d99d9e9802061f726773a0f89d15ec4ed3366957"

[dependencies.oqs]
git = "https://github.com/ziranlang/oqs.git"
ref = "master"

[dependencies.liboqs]
git = "https://github.com/open-quantum-safe/liboqs.git"
ref = "main"
source = true

[dependencies.monocypher]
git = "https://github.com/LoupVaillant/Monocypher.git"
ref = "master"
source = true

[dependencies.entity]
git = "https://git.waozi.xyz/waozi/entity.git"
ref = "4e6b403d5daad43e1f1c09a36e2a69baacb68982"

[dependencies.auth]
git = "https://git.waozi.xyz/waozi/auth.git"
ref = "caf625df3c8720881dfe8818cff35180746bff56"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "master"

[dependencies.workbook]
git = "https://git.waozi.xyz/kryonlabs/workbook.git"
ref = "beda2d582965c391b21d5824cc0e5204f4318617"
