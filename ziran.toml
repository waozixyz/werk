[package]
tool = "kryon"
name = "Werkzeug"
entry = "src/desktop.zi"
module_roots = ["src", "apps/pass"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "03e01d08d9f12a68693294a3bd12f6c758290e45"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "addec5e14fa446e8b66a9480c4d4b277a0d76a9f"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "fec5af055eda9bcc2a2d5a0002a7857bd5cc6a26"

[install]
bin = "werk"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop.zi"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.daochi_client]
git = "https://github.com/ziranlang/daochi-client.git"
ref = "970d5e44b1702158cb16469892da6ff50f142427"

[dependencies.oqs]
git = "https://github.com/ziranlang/oqs.git"
ref = "master"

[dependencies.liboqs]
git = "https://github.com/open-quantum-safe/liboqs.git"
ref = "main"
source = true

[dependencies.monocypher]
git = "https://github.com/LoupVaillant/Monocypher.git"
ref = "master"
source = true

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "2d12bfca10e09e83ac540cc5fd85299b8438150a"

[dependencies.auth]
git = "https://github.com/waozixyz/auth.git"
ref = "44e8b0f2a42d39c699c0f5431dd30689f3b44f3c"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "master"

[dependencies.workbook]
git = "https://github.com/kryonlabs/workbook.git"
ref = "ff3e9f7d1baf3a907304ed3c87ea9fdb37e3e814"
