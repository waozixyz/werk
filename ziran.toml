[package]
tool = "kryon"
name = "Werkzeug"
entry = "src/desktop.zi"
module_roots = ["src", "apps/pass", "apps/calculator", "apps/clock", "apps/gallery"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "e0367fa9c5731dcf9bb84ed7f3d294570d8c0bda"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "3f72441949d4e16094834fa9220e5d7fa77a0ac0"

[dependencies.apps]
git = "https://github.com/waozixyz/apps.git"
ref = "40f598a1719bc99bbef7b61649aa168e923ef1f5"

[install]
bin = "werk"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop.zi"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.mesh_client]
git = "https://github.com/ziranlang/mesh-client.git"
ref = "c1ac6095d01bcfdd4c5ae49c4636aaf9a0303449"

[dependencies.oqs]
git = "https://github.com/ziranlang/oqs.git"
ref = "master"

[dependencies.liboqs]
git = "https://github.com/open-quantum-safe/liboqs.git"
ref = "main"
source = true

[dependencies.monocypher]
git = "https://github.com/LoupVaillant/Monocypher.git"
ref = "master"
source = true

[dependencies.entity]
git = "https://github.com/waozixyz/entity.git"
ref = "3c7df0daa0cfb12fff67dfaac34aac736687a59e"

[dependencies.auth]
git = "https://github.com/waozixyz/auth.git"
ref = "e5a723713bf197b263444529ed55de5b96dd6ced"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "master"

[dependencies.workbook]
git = "https://github.com/kryonlabs/workbook.git"
ref = "020c932232782d5f4526910a183fcb65b67b1e30"
